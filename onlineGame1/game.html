<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拯救 UTOPIA - 海洋冒險</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a6f95;
            color: white;
        }

        /* 🌊 動態天空與海洋背景 */
        .sky-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #103852 0%, #1a6f95 50%, #3895c4 100%);
            z-index: 1;
            overflow: hidden;
        }

        /* ☁️ 雲朵：一體成型 SVG 向量，自然漂移 */
        .cloud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .cloud {
            position: absolute;
            fill: rgba(255, 255, 255, 0.88);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
            animation: driftCloud linear infinite;
        }
        .c1 {
            width: 150px;
            top: 8%;
            left: -160px;
            animation-duration: 22s;
        }
        .c2 {
            width: 200px;
            top: 18%;
            left: -220px;
            animation-duration: 32s;
            animation-delay: -12s;
        }
        .c3 {
            width: 120px;
            top: 13%;
            left: -140px;
            animation-duration: 28s;
            animation-delay: -5s;
            opacity: 0.75;
        }

        @keyframes driftCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 250px)); }
        }

        /* 🌊 藍色動態海浪：浪尖觸及遊戲畫板底部 */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 240px;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
            background-position: 0 bottom;
        }
        /* 後層深藍浪 */
        .wave1 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg"><path d="M0,60 Q150,0 300,60 T600,60 T900,60 T1200,60 L1200,140 L0,140 Z" fill="%230284c7" opacity="0.65"/></svg>');
            background-size: 600px 140px;
            animation: waveMove 7s linear infinite, waveBob 3s ease-in-out infinite alternate;
        }
        /* 中層湛藍浪 */
        .wave2 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg"><path d="M0,45 Q200,110 400,30 T800,30 T1200,45 L1200,140 L0,140 Z" fill="%230369a1" opacity="0.85"/></svg>');
            background-size: 800px 140px;
            animation: waveMove 5s linear infinite reverse, waveBob 2.5s ease-in-out infinite alternate-reverse;
            bottom: -5px;
        }
        /* 前層亮藍海浪帶浪花水邊 */
        .wave3 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg"><path d="M0,35 Q180,85 360,25 T720,25 T1080,25 T1200,35 L1200,140 L0,140 Z" fill="%2338bdf8" opacity="0.9"/></svg>');
            background-size: 700px 140px;
            animation: waveMove 4s linear infinite, waveBob 2s ease-in-out infinite alternate;
            bottom: -10px;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes waveBob {
            0% { transform: translateY(0); }
            100% { transform: translateY(-14px); }
        }

        /* 📱 遊戲介面層級 */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .screen.active {
            display: flex;
        }

        /* 主頁及結算面板 */
        .panel {
            background: rgba(15, 32, 39, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 380px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 198, 255, 0.6);
        }
        p {
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* HUD 狀態列 */
        #game-screen {
            justify-content: flex-start;
            padding-top: 30px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            background: rgba(15, 32, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 15px;
            z-index: 15;
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 2px; }
        .hud-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }

        /* 遊戲畫板 */
        #game-board {
            width: 90vw;
            max-width: 400px;
            height: 58vh;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.4);
            z-index: 15;
        }

        /* 點擊目標船隻 */
        .target {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
            background-image: url('SU image.jpg');
            background-size: cover;
            background-position: center;
            animation: floatAnim 2.5s ease-in-out infinite alternate;
            transition: transform 0.1s;
        }
        .target:active { transform: scale(0.85); }

        @keyframes floatAnim {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        /* 加分飄字特效 */
        .floating-text {
            position: absolute;
            color: #4ade80;
            font-weight: bold;
            font-size: 1.4rem;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 30;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- 🌌 動態背景 (天空、雲朵、藍色海浪) -->
    <div class="sky-background">
        <!-- 雲朵 SVG 向量圖案 -->
        <div class="cloud-container">
            <svg class="cloud c1" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg class="cloud c2" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg class="cloud c3" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
        </div>

        <!-- 三層藍色起伏海浪 -->
        <div class="wave-container">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
        </div>
    </div>

    <!-- 🏠 開始主頁面 -->
    <div id="start-screen" class="screen active">
        <div class="panel">
            <h1>🌊 拯救 UTOPIA 🌊</h1>
            <p>限時 30 秒內點擊出現的船隻<br>展開你的海上冒險！</p>
            <button class="btn" onclick="startGame()">開始遊戲</button>
        </div>
    </div>

    <!-- 🎮 遊戲中頁面 -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">時間</div>
                <div id="timer" class="hud-value">30</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">分數</div>
                <div id="score" class="hud-value">0</div>
            </div>
        </div>
        <div id="game-board"></div>
    </div>

    <!-- 🏆 遊戲結束頁面 -->
    <div id="gameover-screen" class="screen">
        <div class="panel">
            <h1>🏆 冒險結算 🏆</h1>
            <p>你的最終得分：</p>
            <div id="final-score" style="font-size: 3.5rem; font-weight: bold; color: #4ade80; margin-bottom: 20px;">0</div>
            <button class="btn" onclick="startGame()">再次挑戰</button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const scoreBoard = document.getElementById('score');
        const timerBoard = document.getElementById('timer');
        const finalScoreBoard = document.getElementById('final-score');
        const gameBoard = document.getElementById('game-board');

        function startGame() {
            startScreen.classList.remove('active');
            gameoverScreen.classList.remove('active');
            gameScreen.classList.add('active');

            score = 0;
            timeLeft = 30;
            scoreBoard.innerText = score;
            timerBoard.innerText = timeLeft;

            createTarget();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerBoard.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function createTarget() {
            gameBoard.innerHTML = '';
            if (timeLeft <= 0) return;

            const target = document.createElement('div');
            target.classList.add('target');

            const boardWidth = gameBoard.clientWidth;
            const size = Math.floor(boardWidth * 0.22);

            target.style.width = size + 'px';
            target.style.height = size + 'px';

            const maxX = gameBoard.clientWidth - size;
            const maxY = gameBoard.clientHeight - size;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            const handleHit = (e) => {
                e.preventDefault();
                score++;
                scoreBoard.innerText = score;

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                if (clientX && clientY) {
                    showFloatingText(clientX, clientY);
                }

                createTarget();
            };

            target.addEventListener('touchstart', handleHit, { passive: false });
            target.addEventListener('click', handleHit);

            gameBoard.appendChild(target);
        }

        function showFloatingText(x, y) {
            const txt = document.createElement('div');
            txt.classList.add('floating-text');
            txt.innerText = '+1';
            txt.style.left = (x - 10) + 'px';
            txt.style.top = (y - 30) + 'px';
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 600);
        }

        function endGame() {
            gameScreen.classList.remove('active');
            gameoverScreen.classList.add('active');
            finalScoreBoard.innerText = score;
        }
    </script>
</body>
</html>
